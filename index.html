<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Hand-Controlled Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* Loading & Status Overlay */
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 300px;
            z-index: 100;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #00ffcc; }
        p { margin: 5px 0; font-size: 0.9rem; color: #ccc; }
        .highlight { color: #fff; font-weight: bold; }
        
        /* Hide the webcam video, we only need the data */
        #video-feed {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 160px;
            height: 120px;
            transform: scaleX(-1); /* Mirror preview */
            border: 2px solid #333;
            border-radius: 4px;
            opacity: 0.5;
            z-index: 50;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="info">
        <h1>Hand Particle Control</h1>
        <p id="status">Initializing Camera...</p>
        <p>🖐 <b>Open Hand:</b> Expand / Disperse</p>
        <p>✊ <b>Closed Fist:</b> Contract / Concentrate</p>
    </div>

    <video id="video-feed" playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'three/addons/libs/lil-gui.module.min.js';

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, controls;
        let particleSystem;
        let time = 0;
        let handOpenFactor = 0; // 0 = Closed, 1 = Open
        let targetHandFactor = 0; // For smoothing

        // Configuration Object for GUI
        const config = {
            count: 2000,
            size: 0.5,
            shape: 'sprites', // sprites, cubes, spheres
            palette: 'Neon',
            speed: 1.0,
            expansionRadius: 15,
            noiseStrength: 0.5
        };

        // Color Palettes
        const palettes = {
            'Neon': [0x00ffff, 0xff00ff, 0xffff00, 0x0000ff],
            'Fire': [0xff4400, 0xffaa00, 0xff0000, 0x550000],
            'Ice': [0xaaddff, 0x0044ff, 0xffffff, 0x001133],
            'Nature': [0x44ff44, 0x00aa00, 0x88cc00, 0x004400]
        };

        // --- SECTION 1: SCENE SETUP ---
        function initScene() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            // Lights (needed for meshes)
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 10, 10);
            scene.add(dirLight);

            // Handle Resize
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- SECTION 2: PARTICLE SYSTEM ENGINE ---
        
        // Helper to generate textures programmatically to avoid external asset loading issues
        function createSpriteTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            
            // Draw a glowy circle
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(255,255,255,0.5)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        class ParticleManager {
            constructor() {
                this.mesh = null;
                this.dummy = new THREE.Object3D();
                this.baseGeometry = null;
                this.material = null;
                
                // Store particle data CPU side for calculations
                this.particles = [];
                
                this.init(config.shape);
            }

            init(shapeType) {
                // Cleanup existing
                if (this.mesh) {
                    scene.remove(this.mesh);
                    if (this.mesh.geometry) this.mesh.geometry.dispose();
                    if (this.mesh.material) this.mesh.material.dispose();
                }

                this.particles = [];
                const colors = palettes[config.palette];

                // Initialize CPU data for particles
                for (let i = 0; i < config.count; i++) {
                    const colorHex = colors[Math.floor(Math.random() * colors.length)];
                    this.particles.push({
                        x: (Math.random() - 0.5) * 10, // Initial random cluster
                        y: (Math.random() - 0.5) * 10,
                        z: (Math.random() - 0.5) * 10,
                        vx: (Math.random() - 0.5) * 0.2, // Velocity
                        vy: (Math.random() - 0.5) * 0.2,
                        vz: (Math.random() - 0.5) * 0.2,
                        color: new THREE.Color(colorHex),
                        phase: Math.random() * Math.PI * 2
                    });
                }

                // Setup Geometry/Material based on type
                if (shapeType === 'sprites') {
                    this.setupPoints();
                } else if (shapeType === 'cubes') {
                    this.setupMesh(new THREE.BoxGeometry(1, 1, 1));
                } else if (shapeType === 'spheres') {
                    this.setupMesh(new THREE.IcosahedronGeometry(0.5, 1));
                }
            }

            setupPoints() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(config.count * 3);
                const colors = new Float32Array(config.count * 3);

                this.particles.forEach((p, i) => {
                    positions[i * 3] = p.x;
                    positions[i * 3 + 1] = p.y;
                    positions[i * 3 + 2] = p.z;
                    colors[i * 3] = p.color.r;
                    colors[i * 3 + 1] = p.color.g;
                    colors[i * 3 + 2] = p.color.b;
                });

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: config.size,
                    vertexColors: true,
                    map: createSpriteTexture(),
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true
                });

                this.mesh = new THREE.Points(geometry, material);
                scene.add(this.mesh);
            }

            setupMesh(geometry) {
                const material = new THREE.MeshStandardMaterial({
                    roughness: 0.4,
                    metalness: 0.6
                });
                
                this.mesh = new THREE.InstancedMesh(geometry, material, config.count);
                
                this.particles.forEach((p, i) => {
                    this.dummy.position.set(p.x, p.y, p.z);
                    this.dummy.updateMatrix();
                    this.mesh.setMatrixAt(i, this.dummy.matrix);
                    this.mesh.setColorAt(i, p.color);
                });
                
                this.mesh.instanceMatrix.needsUpdate = true;
                this.mesh.instanceColor.needsUpdate = true;
                scene.add(this.mesh);
            }

            update(deltaTime) {
                const timeScale = deltaTime * config.speed;
                const expand = targetHandFactor * config.expansionRadius; // Driven by hand
                
                // If using Points
                if (this.mesh.isPoints) {
                    const positions = this.mesh.geometry.attributes.position.array;
                    
                    for (let i = 0; i < config.count; i++) {
                        const p = this.particles[i];
                        
                        // Calculate base motion (Noise/Wiggle)
                        const noise = Math.sin(time * 2 + p.phase) * config.noiseStrength;
                        
                        // Calculate Expansion Vector from center
                        // If Hand is open (targetHandFactor = 1), particles move to: OriginalPos + Direction * ExpandRadius
                        // If Hand is closed (targetHandFactor = 0), particles cluster near center
                        
                        // We use a "homing" technique. 
                        // Target Position = (Normalized Direction vector) * (BaseRadius + Expansion * HandFactor)
                        
                        const dist = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z) + 0.001;
                        const nx = p.x / dist;
                        const ny = p.y / dist;
                        const nz = p.z / dist;

                        // Dynamic Radius: 
                        // Base (clustered state) = 2.0
                        // Expanded state = 2.0 + config.expansionRadius
                        const currentTargetRadius = 3.0 + (expand * (1 + Math.sin(p.phase)));
                        
                        // Interpolate current position towards target radius position
                        // We simulate this by just modifying the render positions based on the static "p" data
                        // which acts as the "seed" direction.
                        
                        const renderX = nx * currentTargetRadius + Math.cos(time + p.phase) * config.noiseStrength;
                        const renderY = ny * currentTargetRadius + Math.sin(time * 1.2 + p.phase) * config.noiseStrength;
                        const renderZ = nz * currentTargetRadius + Math.sin(time * 0.8 + p.phase) * config.noiseStrength;

                        positions[i * 3] = renderX;
                        positions[i * 3 + 1] = renderY;
                        positions[i * 3 + 2] = renderZ;
                    }
                    this.mesh.geometry.attributes.position.needsUpdate = true;
                }
                // If using InstancedMesh
                else if (this.mesh.isInstancedMesh) {
                    for (let i = 0; i < config.count; i++) {
                        const p = this.particles[i];
                        const dist = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z) + 0.001;
                        const nx = p.x / dist;
                        const ny = p.y / dist;
                        const nz = p.z / dist;

                        const currentTargetRadius = 3.0 + (expand * (1 + Math.sin(p.phase)));

                        const renderX = nx * currentTargetRadius + Math.cos(time + p.phase) * config.noiseStrength;
                        const renderY = ny * currentTargetRadius + Math.sin(time * 1.2 + p.phase) * config.noiseStrength;
                        const renderZ = nz * currentTargetRadius + Math.sin(time * 0.8 + p.phase) * config.noiseStrength;

                        this.dummy.position.set(renderX, renderY, renderZ);
                        
                        // Rotate individual pieces for flair
                        this.dummy.rotation.x = time + p.phase;
                        this.dummy.rotation.y = time + p.phase;
                        
                        const s = config.size;
                        this.dummy.scale.set(s, s, s);
                        
                        this.dummy.updateMatrix();
                        this.mesh.setMatrixAt(i, this.dummy.matrix);
                    }
                    this.mesh.instanceMatrix.needsUpdate = true;
                }
            }

            refresh() {
                this.init(config.shape);
            }
        }

        // --- SECTION 3: UI CONTROLS ---
        function initGUI() {
            const gui = new GUI();
            
            const folderStyle = gui.addFolder('Visuals');
            folderStyle.add(config, 'shape', ['sprites', 'cubes', 'spheres']).name('Particle Shape').onChange(() => particleSystem.refresh());
            folderStyle.add(config, 'palette', Object.keys(palettes)).name('Color Palette').onChange(() => particleSystem.refresh());
            folderStyle.add(config, 'count', 500, 5000, 100).name('Count').onFinishChange(() => particleSystem.refresh());
            folderStyle.add(config, 'size', 0.1, 2.0).name('Size');

            const folderPhysics = gui.addFolder('Physics & Control');
            folderPhysics.add(config, 'speed', 0.1, 5.0).name('Anim Speed');
            folderPhysics.add(config, 'expansionRadius', 5, 30).name('Max Expansion');
            folderPhysics.add(config, 'noiseStrength', 0.1, 2.0).name('Turbulence');
        }

        // --- SECTION 4: HAND TRACKING (MediaPipe) ---
        function initHandTracking() {
            const videoElement = document.getElementById('video-feed');
            const statusElement = document.getElementById('status');

            // Initialize Hands
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            // Initialize Camera
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 320,
                height: 240
            });
            
            cameraUtils.start()
                .then(() => { statusElement.innerHTML = "Camera Active. Detecting Hands..."; })
                .catch(err => { statusElement.innerHTML = "Camera Error: " + err; });
        }

        function onHandResults(results) {
            const statusElement = document.getElementById('status');

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusElement.innerHTML = "<span class='highlight'>Hand Detected</span>";
                statusElement.style.color = "#00ffcc";

                // We only take the first detected hand for simplicity
                const landmarks = results.multiHandLandmarks[0];

                // Calculate "Openness"
                // Distance between Tip of Thumb (4) and Tip of Pinky (20)
                // We normalize this roughly based on the hand scale (Wrist to Middle Finger MCP)
                
                const thumbTip = landmarks[4];
                const pinkyTip = landmarks[20];
                const wrist = landmarks[0];
                const middleMCP = landmarks[9]; // Base of middle finger

                // Distance functions
                const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
                
                const handSize = dist(wrist, middleMCP); // Approximate scale of hand in frame
                const openDist = dist(thumbTip, pinkyTip);

                // Ratio: If openDist is roughly 1.5x handSize, hand is open. If < 0.5x, closed.
                let ratio = openDist / (handSize || 0.1); 
                
                // Clamp and Normalize ratio to 0-1 range
                // Usually ratio 0.3 is closed, 1.2 is fully open
                const minOpen = 0.3;
                const maxOpen = 1.2;
                
                let openness = (ratio - minOpen) / (maxOpen - minOpen);
                openness = Math.max(0, Math.min(1, openness));

                handOpenFactor = openness;
            } else {
                statusElement.innerHTML = "No hand detected";
                statusElement.style.color = "#ccc";
                // Slowly return to idle state if hand is lost
                handOpenFactor = 0.2; 
            }
        }

        // --- SECTION 5: MAIN LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            time += 0.01 * config.speed;

            // Smooth interpolation for hand factor to prevent jitter
            targetHandFactor += (handOpenFactor - targetHandFactor) * 0.1;

            if (particleSystem) {
                particleSystem.update(0.016);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- INITIALIZATION ---
        initScene();
        particleSystem = new ParticleManager();
        initGUI();
        initHandTracking();
        animate();

    </script>
</body>
</html>
