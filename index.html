<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Density Image Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; color: white; }
        #ui-layer {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(0, 0, 0, 0.9); padding: 20px; border-radius: 12px;
            z-index: 100; border: 1px solid #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        h2 { margin: 0 0 10px 0; font-size: 1.1rem; color: #00ffcc; text-transform: uppercase; }
        button#start-btn {
            width: 100%; padding: 12px; background: #00ffcc; border: none;
            border-radius: 6px; color: #000; font-weight: bold; cursor: pointer;
            margin-bottom: 15px;
        }
        #camera-container {
            position: absolute; bottom: 20px; left: 20px; width: 180px; height: 135px;
            border: 2px solid #00ffcc; border-radius: 8px; overflow: hidden;
        }
        #video-feed { width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
        #canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        .hidden { display: none !important; }
        .control-group { margin-bottom: 10px; font-size: 0.8rem; }
        input[type="range"] { width: 100%; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h2>Image Exploder</h2>
        <button id="start-btn">1. START CAMERA</button>
        
        <div id="upload-section" class="hidden">
            <p style="font-size: 0.8rem;">2. Upload Image (PNG/JPG)</p>
            <input type="file" id="imageLoader" accept="image/*" style="margin-bottom:15px;">
            
            <div class="control-group">
                <label>Particle Density (Requires Re-upload)</label>
                <input type="range" id="densityRange" min="1" max="5" step="1" value="1">
            </div>
            <div class="control-group">
                <label>Point Size (Gap Filler)</label>
                <input type="range" id="sizeRange" min="0.05" max="0.5" step="0.01" value="0.2">
            </div>
        </div>

        <div id="status" style="font-size: 0.7rem; color: #888; margin-top: 10px;">Waiting...</div>
    </div>

    <div id="camera-container" class="hidden">
        <video id="video-feed" playsinline></video>
        <canvas id="canvas-overlay"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, particleSystem;
        let handOpenFactor = 0, targetHandFactor = 0;
        let lastImg = null;

        const config = {
            expansion: 35,
            rotationSpeed: 0.2
        };

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 40;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- IMAGE PROCESSING ---
        document.getElementById('imageLoader').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => { lastImg = img; processImage(img); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function processImage(img) {
            if (particleSystem) scene.remove(particleSystem);

            const density = parseInt(document.getElementById('densityRange').value);
            const size = parseFloat(document.getElementById('sizeRange').value);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // We allow higher resolution for "one piece" look
            const maxDim = 200; 
            const scale = Math.min(maxDim / img.width, maxDim / img.height);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const positions = [], colors = [], originals = [];

            // Step through pixels based on density
            // density 1 = every pixel, density 2 = every 2nd pixel
            for (let y = 0; y < canvas.height; y += density) {
                for (let x = 0; x < canvas.width; x += density) {
                    const i = (y * canvas.width + x) * 4;
                    if (data[i+3] > 100) { 
                        const px = (x - canvas.width / 2) * 0.2;
                        const py = (canvas.height / 2 - y) * 0.2;
                        positions.push(px, py, 0);
                        originals.push(px, py, 0);
                        colors.push(data[i]/255, data[i+1]/255, data[i+2]/255);
                    }
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.setAttribute('origin', new THREE.Float32BufferAttribute(originals, 3));

            const mat = new THREE.PointsMaterial({
                size: size, 
                vertexColors: true, 
                transparent: true,
                opacity: 0.9
            });

            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            document.getElementById('status').innerText = `Particles: ${positions.length/3}`;
        }

        // --- HAND TRACKING ---
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('upload-section').classList.remove('hidden');
            document.getElementById('camera-container').classList.remove('hidden');
            initHandTracking();
        });

        function initHandTracking() {
            const video = document.getElementById('video-feed');
            const canvas = document.getElementById('canvas-overlay');
            const ctx = canvas.getContext('2d');

            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });

            hands.onResults(results => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const marks = results.multiHandLandmarks[0];
                    drawConnectors(ctx, marks, HAND_CONNECTIONS, {color: '#00FFCC', lineWidth: 2});
                    const d = Math.hypot(marks[4].x - marks[20].x, marks[4].y - marks[20].y);
                    // 0.05 (Closed) to 0.3 (Open)
                    handOpenFactor = THREE.MathUtils.smoothstep(d, 0.07, 0.28);
                }
            });

            const cam = new Camera(video, {
                onFrame: async () => { 
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    await hands.send({image: video}); 
                }
            });
            cam.start();
        }

        // Update particle size in real-time
        document.getElementById('sizeRange').addEventListener('input', (e) => {
            if (particleSystem) particleSystem.material.size = parseFloat(e.target.value);
        });

        // --- ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);
            targetHandFactor += (handOpenFactor - targetHandFactor) * 0.1;

            if (particleSystem) {
                const posArr = particleSystem.geometry.attributes.position.array;
                const origArr = particleSystem.geometry.attributes.origin.array;
                const time = Date.now() * 0.001;

                for (let i = 0; i < posArr.length; i += 3) {
                    const ox = origArr[i], oy = origArr[i+1];
                    const angle = Math.atan2(oy, ox);
                    
                    // The "Home" state is exactly origArr.
                    // The "Exploded" state is home + direction * expansion.
                    const spread = targetHandFactor * config.expansion;
                    
                    // Add subtle wave only when expanding
                    const wave = Math.sin(time + (ox+oy)*0.5) * targetHandFactor;

                    posArr[i] = ox + (Math.cos(angle) * spread) + wave;
                    posArr[i+1] = oy + (Math.sin(angle) * spread) + wave;
                    posArr[i+2] = Math.sin(time * 2 + ox) * spread * 0.3;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                // Slowly auto-rotate for 3D effect
                particleSystem.rotation.y = Math.sin(time * 0.2) * 0.2;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        initThree();
        animate();
    </script>
</body>
</html>

</head>
<body>

    <div id="ui-layer">
        <h2>Hand-Image Particles</h2>
        <p>1. Enable Camera<br>2. Upload image<br>3. Open hand to explode pixels</p>
        
        <button id="start-btn">ENABLE CAMERA</button>
        
        <div id="upload-section" class="hidden">
            <label style="display:block; margin-bottom:5px; font-size:0.8rem;">Select Image:</label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>

        <div id="status">Status: Waiting for user gesture...</div>
    </div>

    <div id="camera-container" class="hidden">
        <video id="video-feed" playsinline></video>
        <canvas id="canvas-overlay"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls, particleSystem;
        let videoElement, canvasElement, canvasCtx;
        let handOpenFactor = 0, targetHandFactor = 0;

        const config = {
            particleSize: 0.12,
            expansion: 20,
            rotationSpeed: 0.4,
            density: 2, 
            depthEffect: 10
        };

        // --- 1. SETUP THREE.JS ---
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const gui = new GUI();
            gui.add(config, 'particleSize', 0.01, 0.5).name("Point Size");
            gui.add(config, 'expansion', 0, 60).name("Explosion Power");
            gui.add(config, 'rotationSpeed', 0, 2).name("Auto Spin");

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- 2. IMAGE TO PIXELS LOGIC ---
        document.getElementById('imageLoader').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    processImage(img);
                    document.getElementById('status').innerText = "Image Loaded!";
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function processImage(img) {
            if (particleSystem) scene.remove(particleSystem);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxDim = 160;
            const scale = Math.min(maxDim / img.width, maxDim / img.height);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const positions = [], colors = [], originals = [];

            for (let y = 0; y < canvas.height; y += config.density) {
                for (let x = 0; x < canvas.width; x += config.density) {
                    const i = (y * canvas.width + x) * 4;
                    if (data[i+3] > 128) { // Only visible pixels
                        const px = (x - canvas.width / 2) * 0.3;
                        const py = (canvas.height / 2 - y) * 0.3;
                        positions.push(px, py, 0);
                        originals.push(px, py, 0);
                        colors.push(data[i]/255, data[i+1]/255, data[i+2]/255);
                    }
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.setAttribute('origin', new THREE.Float32BufferAttribute(originals, 3));

            particleSystem = new THREE.Points(geo, new THREE.PointsMaterial({
                size: config.particleSize, vertexColors: true, transparent: true
            }));
            scene.add(particleSystem);
        }

        // --- 3. HAND TRACKING ---
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('upload-section').classList.remove('hidden');
            document.getElementById('camera-container').classList.remove('hidden');
            initHandTracking();
        });

        function initHandTracking() {
            videoElement = document.getElementById('video-feed');
            canvasElement = document.getElementById('canvas-overlay');
            canvasCtx = canvasElement.getContext('2d');

            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });

            hands.onResults(results => {
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    document.getElementById('status').innerText = "Hand Active";
                    const marks = results.multiHandLandmarks[0];
                    drawConnectors(canvasCtx, marks, HAND_CONNECTIONS, {color: '#00FFCC', lineWidth: 2});
                    drawLandmarks(canvasCtx, marks, {color: '#FFFFFF', lineWidth: 1, radius: 2});

                    // Distance between Thumb Tip (4) and Pinky Tip (20)
                    const d = Math.hypot(marks[4].x - marks[20].x, marks[4].y - marks[20].y);
                    handOpenFactor = THREE.MathUtils.smoothstep(d, 0.08, 0.35);
                } else {
                    document.getElementById('status').innerText = "Searching for hand...";
                }
            });

            const cam = new Camera(videoElement, {
                onFrame: async () => { 
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    await hands.send({image: videoElement}); 
                }
            });
            cam.start();
        }

        // --- 4. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            targetHandFactor += (handOpenFactor - targetHandFactor) * 0.15;

            if (particleSystem) {
                const posArr = particleSystem.geometry.attributes.position.array;
                const origArr = particleSystem.geometry.attributes.origin.array;
                const time = Date.now() * 0.001;

                for (let i = 0; i < posArr.length; i += 3) {
                    const ox = origArr[i], oy = origArr[i+1];
                    const angle = Math.atan2(oy, ox);
                    const dist = Math.sqrt(ox*ox + oy*oy) + 0.1;
                    
                    const spread = targetHandFactor * config.expansion;
                    posArr[i] = ox + Math.cos(angle) * spread + Math.sin(time + dist) * 0.5;
                    posArr[i+1] = oy + Math.sin(angle) * spread + Math.cos(time + dist) * 0.5;
                    posArr[i+2] = Math.sin(time * 2 + dist * 0.5) * spread * 0.5;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                particleSystem.rotation.y += 0.005 * config.rotationSpeed;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        initThree();
        animate();
    </script>
</body>
</html>
        <input type="file" id="imageLoader" accept="image/*">
        <div id="status" style="margin-top:10px; font-size:0.8rem;">Ready</div>

    <video id="video-feed" playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls, particleSystem;
        let handOpenFactor = 0, targetHandFactor = 0;

        const config = {
            particleSize: 0.1,
            expansion: 15,
            rotationSpeed: 0.5,
            sampleDensity: 2, // Higher = fewer particles (better performance)
            imageScale: 0.1
        };

        // --- SECTION 1: CORE SETUP ---
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const gui = new GUI();
            gui.add(config, 'particleSize', 0.01, 0.5);
            gui.add(config, 'expansion', 0, 50);
            gui.add(config, 'rotationSpeed', 0, 2);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            initHandTracking();
            animate();
        }

        // --- SECTION 2: IMAGE PROCESSING ---
        document.getElementById('imageLoader').addEventListener('change', handleImage);

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => createParticlesFromImage(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function createParticlesFromImage(img) {
            // Clean up old system
            if (particleSystem) scene.remove(particleSystem);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Limit image processing size for performance
            const maxDim = 150; 
            const scale = Math.min(maxDim / img.width, maxDim / img.height);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            const positions = [];
            const colors = [];
            const originals = []; // Store the "home" coordinates

            for (let y = 0; y < canvas.height; y += config.sampleDensity) {
                for (let x = 0; x < canvas.width; x += config.sampleDensity) {
                    const index = (y * canvas.width + x) * 4;
                    const r = imgData[index] / 255;
                    const g = imgData[index + 1] / 255;
                    const b = imgData[index + 2] / 255;
                    const a = imgData[index + 3] / 255;

                    if (a > 0.5) { // Only create particles for non-transparent pixels
                        // Center the image
                        const posX = (x - canvas.width / 2) * config.imageScale;
                        const posY = (canvas.height / 2 - y) * config.imageScale;
                        const posZ = 0;

                        positions.push(posX, posY, posZ);
                        originals.push(posX, posY, posZ);
                        colors.push(r, g, b);
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('originalPos', new THREE.Float32BufferAttribute(originals, 3));

            const material = new THREE.PointsMaterial({
                size: config.particleSize,
                vertexColors: true,
                transparent: true
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            document.getElementById('status').innerText = `System Active: ${positions.length / 3} particles`;
        }

        // --- SECTION 3: HAND TRACKING ---
        function initHandTracking() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });
            hands.onResults(results => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    // Distance between thumb tip (4) and pinky tip (20)
                    const d = Math.hypot(landmarks[4].x - landmarks[20].x, landmarks[4].y - landmarks[20].y);
                    handOpenFactor = THREE.MathUtils.smoothstep(d, 0.05, 0.25);
                }
            });

            const cameraHelper = new Camera(document.getElementById('video-feed'), {
                onFrame: async () => { await hands.send({image: document.getElementById('video-feed')}); },
                width: 320, height: 240
            });
            cameraHelper.start();
        }

        // --- SECTION 4: ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);
            targetHandFactor += (handOpenFactor - targetHandFactor) * 0.1;

            if (particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                const originals = particleSystem.geometry.attributes.originalPos.array;
                const time = Date.now() * 0.001;

                for (let i = 0; i < positions.length; i += 3) {
                    const ox = originals[i];
                    const oy = originals[i+1];
                    const oz = originals[i+2];

                    // Explosion vector (direction from center)
                    const dist = Math.sqrt(ox*ox + oy*oy) + 0.1;
                    const dirX = ox / dist;
                    const dirY = oy / dist;

                    // Apply expansion based on hand
                    const offset = targetHandFactor * config.expansion;
                    
                    // Add some noise/jitter
                    const noise = Math.sin(time + i) * 0.2;

                    positions[i] = ox + (dirX * offset) + noise;
                    positions[i+1] = oy + (dirY * offset) + noise;
                    positions[i+2] = oz + (Math.sin(time + dist) * offset * 0.5);
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                particleSystem.rotation.y += 0.005 * config.rotationSpeed;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
