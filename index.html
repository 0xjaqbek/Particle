<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image-to-Particles Hand Control</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #info {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px;
            z-index: 100; border: 1px solid #444;
        }
        #video-feed {
            position: absolute; bottom: 10px; left: 10px; width: 120px;
            transform: scaleX(-1); border-radius: 4px; opacity: 0.3;
        }
        input[type="file"] { margin-top: 10px; color: #00ffcc; cursor: pointer; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="info">
        <h2 style="margin:0; font-size:1.1rem;">Image Particle Exploder</h2>
        <p style="font-size:0.8rem; color:#aaa;">Upload an image to turn it into 3D particles.</p>
        <input type="file" id="imageLoader" accept="image/*">
        <div id="status" style="margin-top:10px; font-size:0.8rem;">Ready</div>
    </div>

    <video id="video-feed" playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls, particleSystem;
        let handOpenFactor = 0, targetHandFactor = 0;

        const config = {
            particleSize: 0.1,
            expansion: 15,
            rotationSpeed: 0.5,
            sampleDensity: 2, // Higher = fewer particles (better performance)
            imageScale: 0.1
        };

        // --- SECTION 1: CORE SETUP ---
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const gui = new GUI();
            gui.add(config, 'particleSize', 0.01, 0.5);
            gui.add(config, 'expansion', 0, 50);
            gui.add(config, 'rotationSpeed', 0, 2);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            initHandTracking();
            animate();
        }

        // --- SECTION 2: IMAGE PROCESSING ---
        document.getElementById('imageLoader').addEventListener('change', handleImage);

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => createParticlesFromImage(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function createParticlesFromImage(img) {
            // Clean up old system
            if (particleSystem) scene.remove(particleSystem);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Limit image processing size for performance
            const maxDim = 150; 
            const scale = Math.min(maxDim / img.width, maxDim / img.height);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            const positions = [];
            const colors = [];
            const originals = []; // Store the "home" coordinates

            for (let y = 0; y < canvas.height; y += config.sampleDensity) {
                for (let x = 0; x < canvas.width; x += config.sampleDensity) {
                    const index = (y * canvas.width + x) * 4;
                    const r = imgData[index] / 255;
                    const g = imgData[index + 1] / 255;
                    const b = imgData[index + 2] / 255;
                    const a = imgData[index + 3] / 255;

                    if (a > 0.5) { // Only create particles for non-transparent pixels
                        // Center the image
                        const posX = (x - canvas.width / 2) * config.imageScale;
                        const posY = (canvas.height / 2 - y) * config.imageScale;
                        const posZ = 0;

                        positions.push(posX, posY, posZ);
                        originals.push(posX, posY, posZ);
                        colors.push(r, g, b);
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('originalPos', new THREE.Float32BufferAttribute(originals, 3));

            const material = new THREE.PointsMaterial({
                size: config.particleSize,
                vertexColors: true,
                transparent: true
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            document.getElementById('status').innerText = `System Active: ${positions.length / 3} particles`;
        }

        // --- SECTION 3: HAND TRACKING ---
        function initHandTracking() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });
            hands.onResults(results => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    // Distance between thumb tip (4) and pinky tip (20)
                    const d = Math.hypot(landmarks[4].x - landmarks[20].x, landmarks[4].y - landmarks[20].y);
                    handOpenFactor = THREE.MathUtils.smoothstep(d, 0.05, 0.25);
                }
            });

            const cameraHelper = new Camera(document.getElementById('video-feed'), {
                onFrame: async () => { await hands.send({image: document.getElementById('video-feed')}); },
                width: 320, height: 240
            });
            cameraHelper.start();
        }

        // --- SECTION 4: ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);
            targetHandFactor += (handOpenFactor - targetHandFactor) * 0.1;

            if (particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                const originals = particleSystem.geometry.attributes.originalPos.array;
                const time = Date.now() * 0.001;

                for (let i = 0; i < positions.length; i += 3) {
                    const ox = originals[i];
                    const oy = originals[i+1];
                    const oz = originals[i+2];

                    // Explosion vector (direction from center)
                    const dist = Math.sqrt(ox*ox + oy*oy) + 0.1;
                    const dirX = ox / dist;
                    const dirY = oy / dist;

                    // Apply expansion based on hand
                    const offset = targetHandFactor * config.expansion;
                    
                    // Add some noise/jitter
                    const noise = Math.sin(time + i) * 0.2;

                    positions[i] = ox + (dirX * offset) + noise;
                    positions[i+1] = oy + (dirY * offset) + noise;
                    positions[i+2] = oz + (Math.sin(time + dist) * offset * 0.5);
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                particleSystem.rotation.y += 0.005 * config.rotationSpeed;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
