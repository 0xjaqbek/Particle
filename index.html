<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polacy Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #info {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px;
            z-index: 100; border: 1px solid #444; pointer-events: none; /* Let clicks pass through to GUI */
        }
        #video-feed {
            position: absolute; bottom: 10px; left: 10px; width: 120px;
            transform: scaleX(-1); border-radius: 4px; opacity: 0.3; pointer-events: none;
        }
        /* GUI Container override to make sure it's clickable */
        .lil-gui { pointer-events: auto; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="info">
        <h2 style="margin:0; font-size:1.1rem;">Particle Chaos Control</h2>
        <p style="font-size:0.8rem; color:#aaa; margin-top:5px;">
            🖐️ <b>Open Hand:</b> Chaos / Explosion<br>
            ✊ <b>Closed Fist:</b> Assemble Image
        </p>
        <div id="status" style="margin-top:10px; font-size:0.8rem; color:#00ffcc;">Initializing...</div>
    </div>

    <video id="video-feed" playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls, particleSystem;
        let handOpenFactor = 1; // Default to chaos (1 = open, 0 = closed)
        let targetHandFactor = 1;

        // Image Configuration
        const imageConfig = {
            currentImage: 'thePolacyLogo.png', // Default load
            options: ['thePolacyLogo.png', '626.png']
        };

        const config = {
            particleSize: 0.15,
            chaosAmount: 30,    // How far particles scatter
            chaosSpeed: 1.0,    // Speed of noise movement
            returnSpeed: 0.08,  // How fast they snap back to image
            sampleDensity: 2,   // 1 = High Detail, 4 = Low Detail (Performance)
            imageScale: 0.05
        };

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            // 2. GUI Setup
            const gui = new GUI();
            gui.add(imageConfig, 'currentImage', imageConfig.options)
               .name('Select Image')
               .onChange(loadImage);
            
            const folder = gui.addFolder('Chaos Settings');
            folder.add(config, 'chaosAmount', 5, 100);
            folder.add(config, 'particleSize', 0.01, 0.5).onChange(updateMaterial);
            
            // 3. Start System
            loadImage(imageConfig.currentImage);
            initHandTracking();
            animate();

            // Resize Handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function updateMaterial() {
            if (particleSystem) particleSystem.material.size = config.particleSize;
        }

        // --- IMAGE PROCESSING ---
        function loadImage(filename) {
            document.getElementById('status').innerText = `Loading ${filename}...`;
            
            const loader = new THREE.TextureLoader();
            // Assumes images are in the same directory
            loader.load(`./${filename}`, (texture) => {
                createParticles(texture.image);
            }, undefined, (err) => {
                console.error(err);
                document.getElementById('status').innerText = "Error: Run local server to load images!";
                document.getElementById('status').style.color = "red";
            });
        }

        function createParticles(img) {
            if (particleSystem) scene.remove(particleSystem);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Resize for consistent particle count
            const maxDim = 200; 
            const scale = Math.min(maxDim / img.width, maxDim / img.height);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            const positions = [];
            const colors = [];
            const originals = [];
            const randoms = []; // Store random direction for chaos

            for (let y = 0; y < canvas.height; y += config.sampleDensity) {
                for (let x = 0; x < canvas.width; x += config.sampleDensity) {
                    const index = (y * canvas.width + x) * 4;
                    const a = imgData[index + 3];

                    if (a > 128) {
                        const r = imgData[index] / 255;
                        const g = imgData[index + 1] / 255;
                        const b = imgData[index + 2] / 255;

                        // Target Position (The Image)
                        const tx = (x - canvas.width / 2) * config.imageScale;
                        const ty = (canvas.height / 2 - y) * config.imageScale; // Flip Y
                        const tz = 0;

                        positions.push(tx, ty, tz); // Start at target
                        originals.push(tx, ty, tz);
                        colors.push(r, g, b);

                        // Random Vector for Chaos State
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        const rx = Math.sin(phi) * Math.cos(theta);
                        const ry = Math.sin(phi) * Math.sin(theta);
                        const rz = Math.cos(phi);
                        randoms.push(rx, ry, rz);
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('originalPos', new THREE.Float32BufferAttribute(originals, 3));
            geometry.setAttribute('randomDir', new THREE.Float32BufferAttribute(randoms, 3));

            const material = new THREE.PointsMaterial({
                size: config.particleSize,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            document.getElementById('status').innerText = `Active: ${filename}`;
        }

        // --- HAND TRACKING ---
        function initHandTracking() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
            
            hands.onResults(results => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    // Logic: Distance between Thumb Tip (4) and Index Tip (8) or Pinky (20)
                    // Using bounding box of hand to normalize helps, but simple distance is usually enough
                    const p1 = landmarks[4]; // Thumb
                    const p2 = landmarks[20]; // Pinky
                    const distance = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    
                    // Map Distance: < 0.1 (Closed) to > 0.3 (Open)
                    // We want Closed = 0 (Image), Open = 1 (Chaos)
                    const val = THREE.MathUtils.smoothstep(distance, 0.1, 0.35);
                    handOpenFactor = val; // 0 = Closed, 1 = Open
                } else {
                    // If no hand detected, drift towards chaos slowly
                    handOpenFactor = 1; 
                }
            });

            const cameraHelper = new Camera(document.getElementById('video-feed'), {
                onFrame: async () => { await hands.send({image: document.getElementById('video-feed')}); },
                width: 320, height: 240
            });
            cameraHelper.start();
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Interpolate target value for smoothness
            targetHandFactor += (handOpenFactor - targetHandFactor) * config.returnSpeed;

            if (particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                const originals = particleSystem.geometry.attributes.originalPos.array;
                const randoms = particleSystem.geometry.attributes.randomDir.array;
                const time = Date.now() * 0.001;

                // Toggle AutoRotate based on state (Stop rotating when forming image for clarity)
                controls.autoRotate = targetHandFactor > 0.5;

                for (let i = 0; i < positions.length; i += 3) {
                    const ox = originals[i];
                    const oy = originals[i+1];
                    const oz = originals[i+2];

                    // Chaos Calculation
                    // We move from Original (ox) towards Random Direction (rx * amount)
                    const rx = randoms[i];
                    const ry = randoms[i+1];
                    const rz = randoms[i+2];

                    // Add some sine wave movement to the chaos so it feels alive
                    const noise = Math.sin(time + i) * 0.5; 
                    
                    // Current Chaos Offset
                    const chaosX = (rx * config.chaosAmount) + (rx * noise);
                    const chaosY = (ry * config.chaosAmount) + (ry * noise);
                    const chaosZ = (rz * config.chaosAmount) + (rz * noise);

                    // LERP: 0 = Image, 1 = Chaos
                    // We mix Original Position with Chaos Position based on targetHandFactor
                    
                    positions[i] = THREE.MathUtils.lerp(ox, chaosX, targetHandFactor);
                    positions[i+1] = THREE.MathUtils.lerp(oy, chaosY, targetHandFactor);
                    positions[i+2] = THREE.MathUtils.lerp(oz, chaosZ, targetHandFactor);
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
