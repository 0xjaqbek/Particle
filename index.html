<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Particle Depth</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        
        /* Modal Styles */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
            transition: opacity 0.5s ease;
        }
        
        #modal-content {
            background: linear-gradient(145deg, #1a1a1a, #050505);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #333;
            text-align: center;
            color: white;
            max-width: 450px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
        }

        h1 { margin: 0 0 10px 0; font-weight: 300; letter-spacing: 3px; color: #00ffcc; font-size: 1.5rem; }
        
        .instructions {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            margin: 30px 0; font-size: 0.9rem; color: #ccc;
        }
        
        .instruction-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; }
        .instruction-item b { display: block; font-size: 1.8rem; margin-bottom: 10px; }
        .instruction-desc { font-size: 0.8rem; color: #888; line-height: 1.4; }

        #start-btn {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 40px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        #start-btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }

        #video-feed {
            position: absolute; bottom: 10px; left: 10px; width: 160px;
            transform: scaleX(-1); border-radius: 6px; opacity: 0.4; pointer-events: none;
            z-index: 50; border: 1px solid #333;
        }

        #status-indicator {
            position: absolute; bottom: 10px; right: 10px;
            color: #555; font-size: 12px; pointer-events: none;
            font-family: monospace;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
</head>
<body>

    <div id="modal-overlay">
        <div id="modal-content">
            <h1>HOLOGRAPHIC DEPTH</h1>
            <p style="color: #666; font-size: 0.85rem;">STEROWANIE GŁOWĄ I DŁOŃMI</p>
            
            <div class="instructions">
                <div class="instruction-item">
                    <b>😶 HEAD</b>
                    <div class="instruction-desc">Ruszaj głową na boki, aby zmienić perspektywę i zobaczyć głębię 3D.</div>
                </div>
                <div class="instruction-item">
                    <b>🖐️ HAND</b>
                    <div class="instruction-desc">
                        Otwarta: Wybuch/Chaos<br>
                        Zamknięta: Złożenie obrazu
                    </div>
                </div>
            </div>

            <button id="start-btn">URUCHOM SYSTEM</button>
        </div>
    </div>

    <div id="status-indicator">Oczekiwanie na kamerę...</div>
    <video id="video-feed" playsinline></video>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, particleSystem;
        
        // State variables
        let handOpenFactor = 1;      // 1 = Chaos, 0 = Image
        let targetHandFactor = 1;
        
        let headPosition = { x: 0.5, y: 0.5 }; // 0.5 is center
        let targetCameraPos = { x: 0, y: 0 };

        // Configuration
        const config = {
            imageFile: 'thePolacyLogo.png', 
            particleSize: 0.12,
            chaosAmount: 40,
            returnSpeed: 0.1,      // Hand response speed
            headTrackingSpeed: 0.05, // Camera smoothing speed
            sampleDensity: 2,
            imageScale: 0.05,
            depthStrength: 15.0,   // How much "3D" depth the extrusion has
            viewRangeX: 40,        // How far camera moves sideways
            viewRangeY: 15         // How far camera moves up/down
        };

        // --- UI LOGIC ---
        document.getElementById('start-btn').addEventListener('click', () => {
            const modal = document.getElementById('modal-overlay');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 500);
            initMediaPipe(); // Start camera only after click
        });

        function init() {
            scene = new THREE.Scene();
            
            // Fog adds to depth perception
            scene.fog = new THREE.FogExp2(0x050505, 0.015);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 45);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            loadImage(config.imageFile);
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function loadImage(filename) {
            document.getElementById('status-indicator').innerText = "Przetwarzanie obrazu...";
            
            const loader = new THREE.TextureLoader();
            loader.load(`./${filename}`, (texture) => {
                createParticles(texture.image);
            }, undefined, (err) => {
                console.error(err);
                document.getElementById('status-indicator').innerText = "Błąd: Brak pliku obrazu.";
                document.getElementById('status-indicator').style.color = "red";
            });
        }

        function createParticles(img) {
            if (particleSystem) scene.remove(particleSystem);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const maxDim = 200; 
            const scale = Math.min(maxDim / img.width, maxDim / img.height);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            const positions = [];
            const colors = [];
            const originals = [];
            const randoms = [];

            for (let y = 0; y < canvas.height; y += config.sampleDensity) {
                for (let x = 0; x < canvas.width; x += config.sampleDensity) {
                    const index = (y * canvas.width + x) * 4;
                    const a = imgData[index + 3];

                    if (a > 64) {
                        const r = imgData[index] / 255;
                        const g = imgData[index + 1] / 255;
                        const b = imgData[index + 2] / 255;

                        // Calculate brightness for Depth Extrusion (0 to 1)
                        const brightness = (r + g + b) / 3;

                        // Center X/Y
                        const tx = (x - canvas.width / 2) * config.imageScale;
                        const ty = (canvas.height / 2 - y) * config.imageScale;
                        
                        // Z is determined by brightness! This creates the "Geometric Depth"
                        // Brighter pixels pop forward, dark stay back.
                        const tz = brightness * config.depthStrength; 

                        positions.push(tx, ty, tz); 
                        originals.push(tx, ty, tz);
                        colors.push(r, g, b);

                        // Random explosion direction
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        randoms.push(
                            Math.sin(phi) * Math.cos(theta),
                            Math.sin(phi) * Math.sin(theta),
                            Math.cos(phi)
                        );
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('originalPos', new THREE.Float32BufferAttribute(originals, 3));
            geometry.setAttribute('randomDir', new THREE.Float32BufferAttribute(randoms, 3));

            const material = new THREE.PointsMaterial({
                size: config.particleSize,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            document.getElementById('status-indicator').innerText = "System gotowy. Śledzenie aktywne.";
        }

        // --- MEDIAPIPE HOLISTIC (Face + Hands) ---
        function initMediaPipe() {
            const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
            
            holistic.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                refineFaceLandmarks: true, // Important for better eye/face tracking
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            holistic.onResults(onHolisticResults);

            const cameraHelper = new Camera(document.getElementById('video-feed'), {
                onFrame: async () => { await holistic.send({image: document.getElementById('video-feed')}); },
                width: 320, height: 240
            });
            cameraHelper.start();
        }

        function onHolisticResults(results) {
            // 1. HAND TRACKING (Chaos Control)
            // Check both hands
            let handDetected = false;
            let minDist = 1.0; // Normalized distance

            const processHand = (landmarks) => {
                handDetected = true;
                const p1 = landmarks[4];  // Thumb
                const p2 = landmarks[20]; // Pinky
                const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                if (d < minDist) minDist = d;
            };

            if (results.rightHandLandmarks) processHand(results.rightHandLandmarks);
            if (results.leftHandLandmarks) processHand(results.leftHandLandmarks);

            if (handDetected) {
                // Map distance: Closed (~0.05) to Open (~0.25)
                handOpenFactor = THREE.MathUtils.smoothstep(minDist, 0.05, 0.25);
            } else {
                handOpenFactor = 1; // Default to chaos if no hands
            }

            // 2. FACE TRACKING (Camera Depth/Parallax)
            if (results.faceLandmarks) {
                // Landmark 1 is the tip of the nose
                const nose = results.faceLandmarks[1];
                
                // Mediapipe returns x,y in [0,1]. Flip X because webcam is mirrored
                headPosition.x = 1.0 - nose.x; 
                headPosition.y = nose.y;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 1. Smooth Hand Logic (Chaos vs Order)
            targetHandFactor += (handOpenFactor - targetHandFactor) * config.returnSpeed;

            // 2. Smooth Head Logic (Camera Parallax)
            // Map [0,1] to range [-Range, Range]
            const targetX = (headPosition.x - 0.5) * config.viewRangeX;
            const targetY = (headPosition.y - 0.5) * config.viewRangeY;

            // Lerp camera position
            targetCameraPos.x += (targetX - targetCameraPos.x) * config.headTrackingSpeed;
            targetCameraPos.y += (targetY - targetCameraPos.y) * config.headTrackingSpeed;

            // Apply to camera
            // Notice: We move camera opposite to nose to create "window" effect, 
            // OR move it with nose to look around. 
            // Here: We move camera to simulate looking AT the object from that angle.
            camera.position.x = -targetCameraPos.x; 
            camera.position.y = -targetCameraPos.y; 
            camera.lookAt(0, 0, 0); // Always look at center of particles

            // 3. Update Particles
            if (particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                const originals = particleSystem.geometry.attributes.originalPos.array;
                const randoms = particleSystem.geometry.attributes.randomDir.array;
                const time = Date.now() * 0.001;

                for (let i = 0; i < positions.length; i += 3) {
                    // Original positions now include Z-depth (from brightness)
                    const ox = originals[i];
                    const oy = originals[i+1];
                    const oz = originals[i+2];

                    // Chaos Logic
                    const rx = randoms[i];
                    const ry = randoms[i+1];
                    const rz = randoms[i+2];
                    const noise = Math.sin(time + i * 0.1) * 0.5;
                    
                    const chaosX = (rx * config.chaosAmount) + (rx * noise);
                    const chaosY = (ry * config.chaosAmount) + (ry * noise);
                    const chaosZ = (rz * config.chaosAmount) + (rz * noise);

                    // Blend
                    positions[i] = THREE.MathUtils.lerp(ox, chaosX, targetHandFactor);
                    positions[i+1] = THREE.MathUtils.lerp(oy, chaosY, targetHandFactor);
                    positions[i+2] = THREE.MathUtils.lerp(oz, chaosZ, targetHandFactor);
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
