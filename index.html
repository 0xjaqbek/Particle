<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Grid Depth - Head Track Only</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000508; font-family: 'Segoe UI', sans-serif; }
        
        /* Modal Styles */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }
        
        #modal-content {
            background: linear-gradient(145deg, #111, #000);
            padding: 50px;
            border-radius: 4px;
            border: 1px solid #00ffcc;
            text-align: center;
            color: white;
            max-width: 450px;
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.15);
        }

        h1 { margin: 0 0 10px 0; font-weight: 300; letter-spacing: 5px; color: #00ffcc; font-size: 1.8rem; text-transform: uppercase; }
        p { color: #888; font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 40px; }
        
        .icon-container {
            font-size: 3rem; margin-bottom: 20px; color: #fff;
            animation: pulse 2s infinite;
        }

        .instruction-desc { font-size: 1rem; color: #ccc; line-height: 1.6; margin-bottom: 40px; }

        #start-btn {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 15px 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        #start-btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        #video-feed {
            position: absolute; bottom: 20px; left: 20px; width: 160px;
            transform: scaleX(-1); border-radius: 0; opacity: 0.2; pointer-events: none;
            z-index: 50; border: 1px solid #00ffcc;
        }

        #status-indicator {
            position: absolute; bottom: 20px; right: 20px;
            color: #444; font-size: 11px; pointer-events: none;
            font-family: monospace; letter-spacing: 1px;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
</head>
<body>

    <div id="modal-overlay">
        <div id="modal-content">
            <h1>Cyber Geometry</h1>
            <p>HOLOGRAPHIC PERSPECTIVE</p>
            
            <div class="icon-container">👁️</div>
            
            <div class="instruction-desc">
                System śledzi pozycję Twojej głowy.<br>
                Poruszaj się na boki, aby zmienić kąt widzenia i odkryć głębię obiektu.
            </div>

            <button id="start-btn">URUCHOM</button>
        </div>
    </div>

    <div id="status-indicator">OCZEKIWANIE NA KAMERĘ</div>
    <video id="video-feed" playsinline></video>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, gridMesh;
        
        // Zmienne sterujące pozycją głowy
        let headPosition = { x: 0.5, y: 0.5 }; 
        let targetCameraPos = { x: 0, y: 0 };

        // Konfiguracja
        const config = {
            imageFile: 'thePolacyLogo.png', 
            gridDensity: 160,       // Rozdzielczość siatki
            meshScale: 15,          // Rozmiar w świecie 3D
            maxDepth: 7.0,          // Maksymalna wysokość "gór" (Z)
            trackingSensitivity: 20,// Zakres ruchu kamery
            cameraSmoothness: 0.08  // Płynność (niżej = bardziej pływające)
        };

        // --- UI ---
        document.getElementById('start-btn').addEventListener('click', () => {
            const modal = document.getElementById('modal-overlay');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 500);
            initMediaPipe(); 
        });

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000508, 15, 70); // Mgła głębi

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 32);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            loadImage(config.imageFile);
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function loadImage(filename) {
            document.getElementById('status-indicator').innerText = "GENEROWANIE SIATKI...";
            
            const loader = new THREE.TextureLoader();
            loader.load(`./${filename}`, (texture) => {
                createGrid(texture.image);
            }, undefined, (err) => {
                console.error(err);
                document.getElementById('status-indicator').innerText = "BŁĄD PLIKU";
                document.getElementById('status-indicator').style.color = "red";
            });
        }

        function createGrid(img) {
            if (gridMesh) scene.remove(gridMesh);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const width = config.gridDensity;
            const aspect = img.height / img.width;
            const height = Math.floor(width * aspect);
            
            canvas.width = width;
            canvas.height = height;
            
            ctx.drawImage(img, 0, 0, width, height);
            const imgData = ctx.getImageData(0, 0, width, height).data;

            const geometry = new THREE.PlaneGeometry(config.meshScale, config.meshScale * aspect, width - 1, height - 1);
            const count = geometry.attributes.position.count;
            const zValues = new Float32Array(count); 

            for (let i = 0; i < count; i++) {
                const index = i * 4; 
                const r = imgData[index] / 255;
                const g = imgData[index + 1] / 255;
                const b = imgData[index + 2] / 255;
                
                // Obliczanie wysokości na podstawie jasności
                const brightness = (r + g + b) / 3.0;
                
                // Threshold - usuwamy tło (wszystko co ciemne jest płaskie)
                let z = 0;
                if (brightness > 0.1) {
                    z = brightness * config.maxDepth;
                }

                zValues[i] = z;
                geometry.attributes.position.setZ(i, z);
            }

            geometry.setAttribute('targetZ', new THREE.BufferAttribute(zValues, 1));
            
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x00ffcc, 
                wireframe: true,
                transparent: true,
                opacity: 0.4,
                side: THREE.DoubleSide
            });

            gridMesh = new THREE.Mesh(geometry, material);
            scene.add(gridMesh);
            
            document.getElementById('status-indicator').innerText = "SYSTEM AKTYWNY";
        }

        // --- MEDIAPIPE (Face Tracking Only) ---
        function initMediaPipe() {
            const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
            
            holistic.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                refineFaceLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            holistic.onResults(onResults);

            const cameraHelper = new Camera(document.getElementById('video-feed'), {
                onFrame: async () => { await holistic.send({image: document.getElementById('video-feed')}); },
                width: 320, height: 240
            });
            cameraHelper.start();
        }

        function onResults(results) {
            // Ignorujemy dłonie, interesuje nas tylko twarz
            if (results.faceLandmarks) {
                const nose = results.faceLandmarks[1]; 
                
                // Odwracamy oś X dla efektu lustra
                headPosition.x = 1.0 - nose.x;
                headPosition.y = nose.y;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 1. Logika Kamery (Paralaksa)
            // Konwersja pozycji głowy (0-1) na współrzędne świata 3D
            const camX = (headPosition.x - 0.5) * config.trackingSensitivity;
            const camY = (headPosition.y - 0.5) * (config.trackingSensitivity * 0.6); // Y trochę wolniej

            // Interpolacja ruchu (smoothness)
            targetCameraPos.x += (camX - targetCameraPos.x) * config.cameraSmoothness;
            targetCameraPos.y += (camY - targetCameraPos.y) * config.cameraSmoothness;

            // Ustawienie kamery - ruch przeciwny do głowy daje efekt "okna"
            // Ruch zgodny z głową daje efekt "śledzenia"
            // Tutaj stosujemy lekkie przesunięcie, by oglądać obiekt z boku
            camera.position.x = -targetCameraPos.x;
            camera.position.y = -targetCameraPos.y;
            camera.lookAt(0, 0, 0);

            // 2. Animacja "Oddychania" Siatki
            if (gridMesh) {
                const positions = gridMesh.geometry.attributes.position;
                const targets = gridMesh.geometry.attributes.targetZ;
                const time = Date.now() * 0.0015; // Prędkość pulsowania

                for (let i = 0; i < positions.count; i++) {
                    const originalZ = targets.getX(i);
                    
                    if (originalZ > 0.1) { // Animujemy tylko to co wystaje
                        // Fala sinusowa przesuwająca się po osi X
                        const wave = Math.sin(time + positions.getX(i) * 0.5) * 0.2;
                        positions.setZ(i, originalZ + wave);
                    }
                }
                positions.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
