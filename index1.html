<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polacy Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        
        /* Modal Styles */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease;
        }
        
        #modal-content {
            background: linear-gradient(145deg, #1a1a1a, #050505);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #333;
            text-align: center;
            color: white;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
        }

        h1 { margin: 0 0 10px 0; font-weight: 300; letter-spacing: 2px; color: #00ffcc; }
        
        .instructions {
            display: flex; justify-content: space-around; margin: 30px 0;
            font-size: 0.9rem; color: #ccc;
        }
        
        .instruction-item b { display: block; font-size: 1.5rem; margin-bottom: 5px; }

        #start-btn {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #start-btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        #video-feed {
            position: absolute; bottom: 10px; left: 10px; width: 120px;
            transform: scaleX(-1); border-radius: 4px; opacity: 0.3; pointer-events: none;
            z-index: 50;
        }

        /* Loading status in corner */
        #status-indicator {
            position: absolute; bottom: 10px; right: 10px;
            color: #444; font-size: 12px; pointer-events: none;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="modal-overlay">
        <div id="modal-content">
            <h1>PARTICLE CONTROL</h1>
            <p style="color: #666; font-size: 0.8rem; margin-bottom: 20px;">INTERACTIVE HAND TRACKING</p>
            
            <div class="instructions">
                <div class="instruction-item">
                    <b>🖐️</b>
                    Open Hand<br>
                    <span style="font-size:0.7rem; color:#888;">EXPLODE</span>
                </div>
                <div class="instruction-item">
                    <b>✊</b>
                    Closed Fist<br>
                    <span style="font-size:0.7rem; color:#888;">ASSEMBLE</span>
                </div>
            </div>

            <button id="start-btn">Initialize System</button>
        </div>
    </div>

    <div id="status-indicator">System Standby</div>
    <video id="video-feed" playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // GUI Removed as requested

        let scene, camera, renderer, controls, particleSystem;
        let handOpenFactor = 1; 
        let targetHandFactor = 1;

        // Configuration
        const config = {
            imageFile: 'thePolacyLogo.png', // Hardcoded single image
            particleSize: 0.15,
            chaosAmount: 30,    
            returnSpeed: 0.08,  
            sampleDensity: 2,   
            imageScale: 0.05
        };

        // --- UI LOGIC ---
        document.getElementById('start-btn').addEventListener('click', () => {
            const modal = document.getElementById('modal-overlay');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 500);
            
            // Start audio context or other initializers if added later
        });

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enableRotate = true; 
            controls.autoRotate = false; // DISABLED auto rotation

            loadImage(config.imageFile);
            initHandTracking();
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function loadImage(filename) {
            document.getElementById('status-indicator').innerText = "Loading assets...";
            
            const loader = new THREE.TextureLoader();
            loader.load(`./${filename}`, (texture) => {
                createParticles(texture.image);
            }, undefined, (err) => {
                console.error(err);
                document.getElementById('status-indicator').innerText = "Error loading image.";
                document.getElementById('status-indicator').style.color = "red";
            });
        }

        function createParticles(img) {
            if (particleSystem) scene.remove(particleSystem);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const maxDim = 200; 
            const scale = Math.min(maxDim / img.width, maxDim / img.height);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            const positions = [];
            const colors = [];
            const originals = [];
            const randoms = [];

            for (let y = 0; y < canvas.height; y += config.sampleDensity) {
                for (let x = 0; x < canvas.width; x += config.sampleDensity) {
                    const index = (y * canvas.width + x) * 4;
                    const a = imgData[index + 3];

                    if (a > 128) {
                        const r = imgData[index] / 255;
                        const g = imgData[index + 1] / 255;
                        const b = imgData[index + 2] / 255;

                        // Center offsets
                        const tx = (x - canvas.width / 2) * config.imageScale;
                        const ty = (canvas.height / 2 - y) * config.imageScale; 
                        const tz = 0;

                        positions.push(tx, ty, tz); 
                        originals.push(tx, ty, tz);
                        colors.push(r, g, b);

                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        const rx = Math.sin(phi) * Math.cos(theta);
                        const ry = Math.sin(phi) * Math.sin(theta);
                        const rz = Math.cos(phi);
                        randoms.push(rx, ry, rz);
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('originalPos', new THREE.Float32BufferAttribute(originals, 3));
            geometry.setAttribute('randomDir', new THREE.Float32BufferAttribute(randoms, 3));

            const material = new THREE.PointsMaterial({
                size: config.particleSize,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            document.getElementById('status-indicator').innerText = "System Active";
        }

        function initHandTracking() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
            
            hands.onResults(results => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const p1 = landmarks[4]; 
                    const p2 = landmarks[20]; 
                    const distance = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    handOpenFactor = THREE.MathUtils.smoothstep(distance, 0.1, 0.35);
                } else {
                    handOpenFactor = 1; 
                }
            });

            const cameraHelper = new Camera(document.getElementById('video-feed'), {
                onFrame: async () => { await hands.send({image: document.getElementById('video-feed')}); },
                width: 320, height: 240
            });
            cameraHelper.start();
        }

        function animate() {
            requestAnimationFrame(animate);

            targetHandFactor += (handOpenFactor - targetHandFactor) * config.returnSpeed;

            if (particleSystem) {
                // --- FACE OBSERVER LOGIC ---
                // We copy the camera's rotation to the particle system.
                // This ensures the 2D plane of the image is always perpendicular to the view.
                particleSystem.quaternion.copy(camera.quaternion);

                const positions = particleSystem.geometry.attributes.position.array;
                const originals = particleSystem.geometry.attributes.originalPos.array;
                const randoms = particleSystem.geometry.attributes.randomDir.array;
                const time = Date.now() * 0.001;

                for (let i = 0; i < positions.length; i += 3) {
                    const ox = originals[i];
                    const oy = originals[i+1];
                    const oz = originals[i+2];

                    const rx = randoms[i];
                    const ry = randoms[i+1];
                    const rz = randoms[i+2];

                    const noise = Math.sin(time + i) * 0.5; 
                    
                    const chaosX = (rx * config.chaosAmount) + (rx * noise);
                    const chaosY = (ry * config.chaosAmount) + (ry * noise);
                    const chaosZ = (rz * config.chaosAmount) + (rz * noise);

                    positions[i] = THREE.MathUtils.lerp(ox, chaosX, targetHandFactor);
                    positions[i+1] = THREE.MathUtils.lerp(oy, chaosY, targetHandFactor);
                    positions[i+2] = THREE.MathUtils.lerp(oz, chaosZ, targetHandFactor);
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
